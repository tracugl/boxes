services:
  web:
    build:
      context: .
      dockerfile: scripts/Dockerfile
      args:
        # Include the 3D export (--format step) for local development.
        WITH_STEP: "1"
    command:
      - /app/env/bin/gunicorn
      - --reload
      - -b
      - "[::]:8000"
      - -w
      - "2"
      - scripts.boxesserver
    environment:
      STATIC_URL: /static
    volumes:
      - /app/env
      - /app/scripts
      - ./:/app
    ports:
      - 4455:8000
